[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dock-api"
version = "0.2.1"
description = "Configure local projects and provision them with Docker"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
ai = ["openai>=1.66,<2", "pydantic>=2,<3"]

[project.urls]
Homepage = "https://dockit-orcin.vercel.app/"
Documentation = "https://dockit-orcin.vercel.app/docs"

[project.scripts]
dock = "dock:main"

[tool.setuptools]
packages = ["docklib", "docklib.ai"]
py-modules = ["dock"]
